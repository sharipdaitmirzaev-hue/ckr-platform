# CKR Platform — Nginx reverse proxy
# Установка:
#   sudo cp deploy/nginx/ckr.conf /etc/nginx/sites-available/ckr
#   sudo ln -sf /etc/nginx/sites-available/ckr /etc/nginx/sites-enabled/ckr
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените YOUR_DOMAIN на реальный домен.
# update-production.sh при наличии Let's Encrypt сертификата
# сам включает HTTPS-блок (см. deploy/nginx/ckr.https.conf).

upstream ckr_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Раскомментируйте после настройки SSL, чтобы редиректить на HTTPS:
    # return 301 https://YOUR_DOMAIN$request_uri;

    client_max_body_size 25m;

    location /api/health {
        proxy_pass http://ckr_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://ckr_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
