# Production deploy via SSH. Never uses staging secrets.
name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка для деплоя"
        required: true
        default: "main"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_HOST: 161.104.18.135
      # Keep the session alive during long npm ci / next build (no stdout for minutes).
      SSH_OPTS: "-i /home/runner/.ssh/ckr_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes"

    steps:
      - name: Подготовить SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CKR_SSH_PRIVATE_KEY }}" > ~/.ssh/ckr_deploy
          chmod 600 ~/.ssh/ckr_deploy
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Проверить SSH
        shell: bash
        run: |
          ssh ${SSH_OPTS} cursor-agent@${SSH_HOST} "echo SSH_OK"

      - name: Проверить production до обновления
        shell: bash
        run: |
          ssh ${SSH_OPTS} cursor-agent@${SSH_HOST} \
            "cd /var/www/ckr-platform && \
             echo COMMIT_BEFORE && git rev-parse --short HEAD && \
             echo SERVICE_BEFORE && sudo systemctl is-active ckr"

      - name: Выполнить deploy
        shell: bash
        run: |
          ssh ${SSH_OPTS} cursor-agent@${SSH_HOST} \
            "cd /var/www/ckr-platform && \
             sudo ./scripts/update-production.sh '${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}'"

      - name: Проверить production после обновления
        shell: bash
        run: |
          ssh ${SSH_OPTS} cursor-agent@${SSH_HOST} \
            "cd /var/www/ckr-platform && \
             echo COMMIT_AFTER && git rev-parse --short HEAD && \
             echo SERVICE_AFTER && sudo systemctl is-active ckr"

      - name: Проверить публичный сайт
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            -L --max-time 30 \
            https://ckr-center.ru/api/health
